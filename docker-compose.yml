services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina uma senha no .env (openssl rand -hex 16)}
      POSTGRES_DB: ${POSTGRES_DB:-pato_da_mega}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/seed/caso.sql:/docker-entrypoint-initdb.d/01-caso.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workshop} -d ${POSTGRES_DB:-pato_da_mega}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-workshop}:${POSTGRES_PASSWORD:?defina uma senha no .env}@db:5432/${POSTGRES_DB:-pato_da_mega}
      # senha do investigador fica fixa em app/seed/caso.sql, trocar nos dois lugares se mudar
      INVESTIGADOR_DATABASE_URL: postgresql+psycopg2://investigador:investigador_ro_2026@db:5432/${POSTGRES_DB:-pato_da_mega}
    ports:
      - "${API_PORT:-8000}:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  pgdata:
